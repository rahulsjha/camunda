name: fork-check-70020
on:
  push:
    branches: [ci/70020b]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [unfixed, fixed]
    env:
      # a non-UTF-8 default charset, as on JDK 17 with a C/POSIX locale
      LANG: C
      LC_ALL: C
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Use the code before the fix
        if: matrix.variant == 'unfixed'
        run: git checkout bb9bc0ea3da -- testing/camunda-process-test-java/src/main/java/io/camunda/process/test/impl/mock/MockDmnDecisionBuilderImpl.java && git diff --cached --stat
      - name: Install upstream modules
        run: ./mvnw -B -ntp -T1C -pl testing/camunda-process-test-java -am install -DskipTests -DskipChecks -Djacoco.skip=true
      - name: Default charset under -Dfile.encoding=COMPAT
        run: |
          printf 'public class C{public static void main(String[] a){System.out.println(java.nio.charset.Charset.defaultCharset());}}' > /tmp/C.java
          java -Dfile.encoding=COMPAT /tmp/C.java
      - name: MockDmnDecisionTest
        run: set -o pipefail; ./mvnw -B -ntp -pl testing/camunda-process-test-java test -DskipChecks -Djacoco.skip=true -Dtest=MockDmnDecisionTest -Dsurefire.failIfNoSpecifiedTests=false -DargLine="-Dfile.encoding=COMPAT" 2>&1 | tee test.log
      - name: Summary
        if: always()
        run: grep -E "Tests run:|FAIL|expected|Expecting|BUILD|ERROR\]" test.log | head -40
